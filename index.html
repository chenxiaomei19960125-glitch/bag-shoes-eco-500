<style>
:root{--ink:#142b2b;--muted:#64736f;--paper:#f5f6f2;--line:#dbe2dc;--green:#166653;--lime:#daedac;--orange:#b75b32;--blue:#3d6a8a;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}a{color:var(--green)}
.wrap{max-width:1320px;margin:auto;padding:0 32px}
.topbar{height:68px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:12px}
.brand{font-weight:750;letter-spacing:1px}.brand:before{content:"";display:inline-block;width:12px;height:12px;background:var(--green);margin-right:10px}
.small{font-size:12px;color:var(--muted)}.btn{border:1px solid var(--line);border-radius:6px;background:#fff;padding:7px 14px;text-decoration:none;font-weight:600;font-size:13px}

.stat{background:var(--ink);padding:18px 14px 0 0}.stat strong{font-size:26px;letter-spacing:-.5px;display:block}.stat span{font-size:12px;color:#c5d2cd}

.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow:auto}

h2{font-size:23px;letter-spacing:-.4px;line-height:1.4;margin:0 0 10px}h3{font-size:16px;margin:0 0 10px}p{margin:6px 0 12px}

.concl b.t{display:block;color:var(--green);font-size:12px;letter-spacing:1px;margin-bottom:4px}.concl ul{margin:0;padding-left:18px}.concl li{margin:3px 0}
.qchart{width:100%;height:auto;display:block;background:#fff}.qchart text{font-family:inherit}
.big{font-size:26px;font-weight:750;margin:6px 0}
.callout{border-left:3px solid var(--green);padding:13px 17px;background:#eaf1e6;margin:16px 0;font-size:13.5px}.callout.o{border-left-color:var(--orange);background:#faf0e6}
.tag{display:inline-block;background:#edf2eb;color:var(--green);padding:2px 8px;border-radius:4px;font-size:11px;margin:2px 4px 2px 0}
.tag.o{background:#f6eee7;color:var(--orange)}.tag.g{background:#edf0f0;color:#5a686c}.tag.b{background:#e8eff5;color:var(--blue)}
.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}
th{background:#f1f4ef;color:#5f6b65;font-weight:600;white-space:nowrap}th,td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}tbody tr:hover{background:#fafbf8}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--green);vertical-align:middle;margin-right:6px}
.bar.o{background:var(--orange)}
.hi{color:var(--green);font-weight:700}.lo{color:var(--orange);font-weight:700}
.chart{width:100%;height:auto;display:block}.chart text{font-family:inherit;fill:var(--muted);font-size:11px}
.list li{margin-bottom:8px}.list{padding-left:20px;margin:6px 0}
.feat{display:grid;grid-template-columns:200px 1fr 60px;gap:8px;align-items:center;font-size:12.5px;padding:5px 0;border-bottom:1px dashed #e4e9e3}
.feat .track{position:relative;height:16px;background:#f2f4f0;border-radius:3px}.feat .g1,.feat .g2{position:absolute;left:0;height:7px;border-radius:3px}
.feat .g1{top:1px;background:var(--green)}.feat .g2{top:8px;background:#c4cdc6}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mini button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:0;text-align:left;overflow:hidden}
.mini img{width:100%;height:190px;object-fit:cover;display:block;background:#e9eee7}.mini div{padding:7px 9px;font-size:11.5px;line-height:1.5}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tools input,.tools select{background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:6px}.tools input{flex:1;min-width:180px}
.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:18px;margin-bottom:14px;scroll-margin-top:16px}
.card-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.card h3{margin:5px 0 2px;font-size:17px}
.card-body{display:grid;grid-template-columns:170px 1fr;gap:18px;margin-top:12px}
.preview{background:#122121;border-radius:7px;overflow:hidden;height:300px}.preview video,.preview img{width:100%;height:100%;object-fit:contain;display:block}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:6px;padding:7px 9px}.metric b{display:block;font-size:17px}.metric span{font-size:11px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}.strip button{border:0;padding:0;background:#eef1ec;border-radius:4px;overflow:hidden;font-size:10px;color:var(--muted)}
.strip img{width:100%;height:112px;object-fit:cover;display:block}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 14px;font-size:12.5px;margin-top:10px}.facts b{color:var(--muted);font-weight:500;margin-right:4px}
.pager{display:flex;gap:6px;justify-content:center;align-items:center;margin:16px 0}.pager button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 12px}
.pager button[disabled]{opacity:.4;cursor:default}
details summary{cursor:pointer;color:var(--green);font-size:12.5px}
.status{padding:60px;text-align:center;color:var(--muted)}
.foot{border-top:1px solid var(--line);padding:22px 0;margin-top:26px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:20px}
dialog{padding:18px;border:0;border-radius:10px;max-width:95vw;max-height:96vh}dialog::backdrop{background:#122b2bbb}dialog img{display:block;max-width:85vw;max-height:80vh}
dialog button{float:right;margin-bottom:8px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 12px}
@media(max-width:900px){.wrap{padding:0 14px}.stats{grid-template-columns:repeat(3,1fr)}.grid2,.grid3{grid-template-columns:1fr}.card-body{grid-template-columns:1fr}.preview{max-width:240px}.strip{grid-template-columns:repeat(5,1fr)}.metrics,.facts{grid-template-columns:repeat(2,1fr)}.feat{grid-template-columns:120px 1fr 50px}.hero h1{font-size:28px}}

<header class="topbar"><div class="brand">CREATIVE FIELDNOTES <span class="small">/ 箱包鞋靴</span></div><span class="small">10.10 数据批次 · 500 条素材 · 前 30 秒逐帧</span><div style="display:flex;gap:8px"><a class="btn" href="archive/2026-10-08/index.html">10.08 旧版</a><a class="btn" href="箱包鞋靴_10.10_ECO创意分析.xlsx" download>下载 Excel ↗</a></div></header>
<section class="hero"><div class="eyebrow">Creative intelligence / 10.10</div><h1 id="headline">箱包鞋靴素材 ECO 创意诊断</h1><p id="subline">500 条素材逐条抽取前 30 秒 10 帧并识别字幕，按创意大类、人物出镜、讲品节奏拆解 ECO 高低，再看 ECO 与消耗、CTR 的关系。</p><div class="stats" id="hero-stats"></div></section>
<div class="toolbar"><div class="segments" role="group" aria-label="范围"><button data-scope="全部" class="active">全部</button><button data-scope="鞋靴">鞋靴</button><button data-scope="箱包">箱包</button></div><span class="small" id="scope-note"></span></div>
<nav class="tabs"><button data-tab="track" class="active">01　赛道判断</button><button data-tab="driver">02　ECO 驱动验证</button><button data-tab="quad">03　ECO × 消耗 × CTR</button><button data-tab="types">04　高低 ECO 素材类型</button><button data-tab="lib">05　逐帧素材库</button><button data-tab="method">06　口径与局限</button></nav>

<script>
let D,scope='全部',tab='track',lib={fw:'全部',q:'全部',hook:'全部',sort:'cost',kw:'',page:1};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=(v,n=1)=>v==null||Number.isNaN(v)?'—':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:n,maximumFractionDigits:n});
const pct=(v,n=0)=>v==null?'—':f(v*100,n)+'%';
const S=()=>D.stats[scope], I=()=>(D.insights||{})[scope]||{}, M=k=>D.materials.find(m=>m.key===k);
const inScope=m=>scope==='全部'||m.category===scope;
const C=(k,sc=scope)=>((D.stats[sc]||{}).concl||{})[k]||[];
function concl(k,sc=scope){const a=C(k,sc);return a.length?`<div class="concl"><b class="t">结论</b><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
function tbl(head,rows){return `<div class="scroll"><table><thead><tr>${head.map(h=>`<th class="${h[1]||''}">${h[0]}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function cmp(v,base,inv){if(v==null||base==null)return f(v,0);const good=inv?v<base:v>=base;return `<span class="${good?'hi':'lo'}">${f(v,0)}</span>`}
function intro(k,t,d){return `<div class="intro"><div class="kicker">${k}</div><h2>${t}</h2>${d?`<div class="muted">${d}</div>`:''}</div>`}
function textBlocks(arr,cls=''){return (arr||[]).map(x=>`<div class="panel insight ${cls}"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`).join('')}
function groupRows(list,s){const maxShare=Math.max(...list.map(g=>g.n));return list.map(g=>`<tr><td><b>${esc(g.name)}</b></td><td class="n">${g.n}</td><td><span class="bar" style="width:${g.n/maxShare*70}px"></span>${pct(g.n/s.n_reviewed)}</td><td class="n">${pct(g.cost_share)}</td><td class="n">${cmp(g.eco,s.eco)}</td><td class="n">${f(g.skip)}%</td><td class="n">${f(g.play)}s</td><td class="n">${f(g.ctr,2)}%</td><td class="n">${pct(g.face3)}</td><td class="n">${pct(g.pf03)}</td><td class="n">${pct(g.product_share)}</td><td class="n">${f(g.cuts30)}</td></tr>`)}
const GH=[['分类'],['素材数','n'],['数量占比'],['消耗占比','n'],['平均ECO','n'],['3s快滑','n'],['均播','n'],['CTR','n'],['前3秒露脸','n'],['产品0–3秒出现','n'],['讲品帧占比','n'],['30秒切镜','n']];
function smallTable(title,list,s,note,ck){return `<div class="panel"><h3>${title}</h3>${tbl([['分组'],['n','n'],['占比','n'],['ECO','n'],['3s快滑','n'],['均播','n'],['CTR','n']],list.map(g=>`<tr><td>${esc(g.name)}</td><td class="n">${g.n}</td><td class="n">${pct(g.n/s.n_reviewed)}</td><td class="n">${cmp(g.eco,s.eco)}</td><td class="n">${f(g.skip)}%</td><td class="n">${f(g.play)}s</td><td class="n">${f(g.ctr,2)}%</td></tr>`))}${note?`<p class="small">${note}</p>`:''}${ck?concl(ck):''}</div>`}
function track(){const s=S(),i=I(),b=D.benchmark;return intro('01 / TRACK DIAGNOSIS','赛道整体判断：ECO 为什么不够',`${scope} · ${s.n_valid} 条指标齐全素材 · 平均 ECO ${f(s.eco,0)}（消耗加权 ${f(s.eco_w,0)}），原表“整体”基准 ${f(b.eco,0)}。绿色/橙色 = 高于/低于本范围均值。`)
+`<div class="callout o"><b>一句话判断：</b>${esc(i.headline||C('headline').join(' '))}</div>`
+`<div class="grid3">${textBlocks(i.diagnosis,'o')}</div>`
+`<div class="panel"><h3>创意大类结构（逐条画面标注）</h3>${tbl(GH,groupRows(s.frameworks,s))}<p class="small">“讲品帧占比”= 10 张关键帧中产品为画面主体的比例；“产品0–3秒出现”= 产品在 3 秒内成为画面主体的素材占比；切镜为前 30 秒自动检测的镜头切换次数。</p>${concl('fw')}</div>`
+`<div class="grid2">${smallTable('人物出镜方式',s.persons,s,'','persons')}${smallTable('产品首次成为画面主体的时间',s.pf,s,'讲品太早 / 太晚都会影响停留，需结合大类判断。','pf')}${smallTable('讲品帧占比（前 30 秒）',s.product_share,s,'占比越高 = 越像“纯讲货”。','product_share')}${smallTable('开场钩子',s.hooks,s,'','hooks')}</div>`
+(i.improve&&i.improve.length?`<div class="kicker" style="margin-top:8px">HOW TO IMPROVE</div><h2>怎么提升</h2><div class="grid2">${textBlocks(i.improve)}</div>`:'')}
function bins(list,title,color){const max=Math.max(...list.map(x=>x.eco||0)),min=Math.min(...list.filter(x=>x.eco).map(x=>x.eco));const lo=Math.floor((min-40)/50)*50;return `<svg class="chart" viewBox="0 0 560 250" role="img" aria-label="${title}">${list.map((x,j)=>{const h=x.eco?(x.eco-lo)/(max-lo)*170:0;return `<rect x="${30+j*88}" y="${200-h}" width="56" height="${h}" rx="3" fill="${color}" opacity="${x.n<10?.45:.9}"/><text x="${58+j*88}" y="${193-h}" text-anchor="middle" style="fill:#142b2b;font-weight:600">${x.eco?f(x.eco,0):'—'}</text><text x="${58+j*88}" y="218" text-anchor="middle">${x.label}</text><text x="${58+j*88}" y="234" text-anchor="middle">n=${x.n}</text>`}).join('')}<text x="30" y="14">平均 ECO（纵轴起点 ${lo}）</text></svg>`}
function driver(){const s=S(),i=I(),c=s.corr,o=s.ols;return intro('02 / DRIVERS','ECO 与 3s 快滑率、平均播放时长',`${scope} · ${s.n_valid} 条。快滑越高 ECO 越低、播放越长 ECO 越高——用数据验证方向和力度。`)
+`<div class="grid3"><div class="panel insight o"><div class="small">ECO × 3s 快滑率（Spearman）</div><div class="big">${f(c.skip.spearman,2)}</div><p>负相关：快滑越高，ECO 越低。Pearson ${f(c.skip.pearson,2)}。</p></div><div class="panel insight"><div class="small">ECO × 平均播放时长（Spearman）</div><div class="big">${f(c.play.spearman,2)}</div><p>正相关：播放越长，ECO 越高。Pearson ${f(c.play.pearson,2)}。</p></div><div class="panel insight b"><div class="small">两项合计解释 ECO 差异</div><div class="big">${pct(o.r2)}</div><p>OLS 拟合 R²，5 折验证 ${pct(o.cv_r2)}。标准化影响力 快滑 ${f(Math.abs(o.beta_skip),2)} : 均播 ${f(Math.abs(o.beta_play),2)}。</p></div></div>`
+`<div class="panel"><h3>相关与回归 · 结论</h3>${concl('driver')}</div>`
+`<div class="grid2"><div class="panel"><h3>按 3s 快滑率分档</h3>${bins(s.skip_bins,'快滑分档','#b75b32')}${concl('skip_bins')}</div><div class="panel"><h3>按平均播放时长分档</h3>${bins(s.play_bins,'均播分档','#166653')}${concl('play_bins')}</div></div>`
+`<div class="panel"><h3>估算式（描述性拟合，非平台公式）</h3><p style="font-family:ui-monospace,monospace;background:#f0f3ee;padding:12px;border-radius:5px">ECO ≈ ${f(o.intercept,0)} ${o.b_skip<0?'−':'+'} ${f(Math.abs(o.b_skip),2)} × 快滑率(%) ${o.b_play<0?'−':'+'} ${f(Math.abs(o.b_play),2)} × 均播(秒)</p><p class="small">快滑与均播本身相关（Spearman ${f(s.corr_skip_play,2)}），信息有重叠；其余差异来自互动、负反馈等表内没有的字段。浅色柱 = 样本 &lt;10 条。</p>${i.drivers?`<div class="callout">${esc(i.drivers)}</div>`:''}</div>`}
function featBars(pr){return pr.features.filter(x=>Math.abs(x.diff)>=0.04).slice(0,12).map(x=>`<div class="feat"><div>${esc(x.feature)}</div><div class="track"><span class="g1" style="width:${(x.group||0)*100}%"></span><span class="g2" style="width:${(x.rest||0)*100}%"></span></div><div class="n ${x.diff>0?'hi':'lo'}">${x.diff>0?'+':''}${f(x.diff*100,0)}pt</div></div>`).join('')||'<p class="small">无明显差异特征。</p>'}
function quadTable(q,keys){return tbl([['象限'],['素材数','n'],['平均ECO','n'],['平均消耗(元)','n'],['平均CTR','n'],['3s快滑','n'],['均播','n'],['前3秒露脸','n']],keys.map(k=>{const m=q[k].metrics;return m?`<tr><td><b>${k}</b></td><td class="n">${q[k].n}</td><td class="n">${f(m.eco,0)}</td><td class="n">${f(m.cost_mean,0)}</td><td class="n">${f(m.ctr,2)}%</td><td class="n">${f(m.skip)}%</td><td class="n">${f(m.play)}s</td><td class="n">${pct(m.face3)}</td></tr>`:`<tr><td>${k}</td><td class="n">0</td><td colspan="6">—</td></tr>`}))}
function miniCards(keys,n=8){return `<div class="mini">${keys.slice(0,n).map(M).filter(Boolean).map(m=>`<button data-open="${m.key}"><img loading="lazy" src="${esc(m.frames[0]?.path||'')}" alt=""><div><b>${esc(m.type||'未复核')}</b><br>ECO ${f(m.eco,0)} · CTR ${f(m.ctr,2)}%<br>消耗 ¥${f(m.cost,0)} · 快滑 ${f(m.skip,0)}%</div></button>`).join('')}</div>`}
function quad(){const s=S(),i=I(),qc=s.quad_cost,qt=s.quad_ctr,c=s.corr;return intro('03 / ECO × COST × CTR','在保住 CTR 和消耗的前提下提升 ECO',`四象限在各品类内部按中位数切分（${scope==='全部'?'鞋靴、箱包各自切分后合并':`ECO ${f(s.eco_median,0)} / 消耗 ¥${f(s.cost_median,0)} / CTR ${f(s.ctr_median,2)}%`}）。ECO×消耗 Spearman ${f(c.cost.spearman,2)}，ECO×CTR Spearman ${f(c.ctr.spearman,2)}。`)
+(i.quad_headline?`<div class="callout o">${esc(i.quad_headline)}</div>`:'')

const FWC={'剧情型':'#2f6fdb','人设口播型':'#8a5bd0','产品展示型':'#d9534f','街拍穿搭型':'#1d9a8a','测评实验型':'#e07b00','工厂溯源型':'#8b6b3d','情感送礼型':'#d6458f','直播切片型':'#4f6272','图文型':'#7a7a7a'};
const TIERC={'高':'#3aa682','中':'#f5b942','低':'#e0605e'};
function tw(t,sz=12){let w=0;for(const c of t)w+=c.charCodeAt(0)>255?sz:sz*.56;return w}
function quadChart(cat){
  const qd=(D.stats[cat]||{}).quadrant;if(!qd||qd.points.length<3)return '<p class="small">素材类型不足 3 个，无法作图。</p>';
  const W=1100,H=680,L=72,R=26,T=64,B=62,pw=W-L-R,ph=H-T-B,P=qd.points.map(p=>({...p,lab:(p.framework?p.framework+'-':'')+p.name}));
  const xs=P.map(p=>p.skip),ys=P.map(p=>p.play);
  const x0=Math.floor((Math.min(...xs,qd.skip_ref)-6)/5)*5,x1=Math.ceil((Math.max(...xs,qd.skip_ref)+6)/5)*5;
  const y0=0,y1=Math.ceil(Math.max(...ys,qd.play_ref)*1.18/5)*5;
  const X=v=>L+(v-x0)/(x1-x0)*pw,Y=v=>T+ph-(v-y0)/(y1-y0)*ph;
  const mc=Math.max(...P.map(p=>p.cost_sum));P.forEach(p=>{p.cx=X(p.skip);p.cy=Y(p.play);p.r=4+Math.sqrt(p.cost_sum/mc)*34;});
  const obs=[{x:L+8,y:T+8,w:236,h:58},{x:W-R-228,y:H-B-66,w:220,h:58},{x:W-R-206,y:T+8,w:198,h:84}];
  const rects=[];const hit=(a,b,pad=3)=>a.x<b.x+b.w+pad&&a.x+a.w+pad>b.x&&a.y<b.y+b.h+pad&&a.y+a.h+pad>b.y;
  const circHit=(r,c)=>{const nx=Math.max(r.x,Math.min(c.cx,r.x+r.w)),ny=Math.max(r.y,Math.min(c.cy,r.y+r.h));return (nx-c.cx)**2+(ny-c.cy)**2<c.r*c.r};
  const order=[...P].sort((a,b)=>a.r-b.r);
  order.forEach(p=>{const l1=p.lab,l2='eco '+f(p.eco,0),w=Math.max(tw(l1),tw(l2))+14,h=38;let best=null;
    for(const dist of [6,22,42,66,94,128,168,215]){for(let k=0;k<24;k++){const a=k/24*Math.PI*2,ca=Math.cos(a),sa=Math.sin(a);
      const bx=p.cx+ca*(p.r+dist+Math.abs(ca)*w/2)-w/2,by=p.cy+sa*(p.r+dist+Math.abs(sa)*h/2)-h/2,rc={x:bx,y:by,w,h};let sc=dist*1.2;
      if(bx<L+2||bx+w>W-R-2||by<T+2||by+h>H-B-2)sc+=1e5;
      for(const o of obs)if(hit(rc,o))sc+=1e4;for(const q of rects)if(hit(rc,q))sc+=1e4;
      for(const c of P)if(circHit(rc,c))sc+=c===p?600:220;
      if(!best||sc<best.sc)best={sc,rc};}}
    p.box=best.rc;rects.push(best.rc);});
  const ticks=(a,b,st)=>{const o=[];for(let v=Math.ceil(a/st)*st;v<=b;v+=st)o.push(v);return o};
  const sx=(x1-x0)>40?10:5,sy=y1>30?10:5;
  let g=`<svg class="qchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${cat}素材类型四象限图">`;
  g+=`<text x="${W/2}" y="26" text-anchor="middle" font-size="19" font-weight="700" fill="#142b2b">【${cat}】素材类型 × eco 分层 四象限分布</text><text x="${W/2}" y="48" text-anchor="middle" font-size="14" fill="#64736f">（气泡大小 = 消耗合计）</text>`;
  g+=`<rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="#fafafa" stroke="#cfd6d0"/>`;
  ticks(x0,x1,sx).forEach(v=>{g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${T+ph}" stroke="#e6e9e5"/><text x="${X(v)}" y="${T+ph+18}" text-anchor="middle" font-size="12" fill="#64736f">${v}</text>`});
  ticks(y0,y1,sy).forEach(v=>{g+=`<line x1="${L}" x2="${L+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6e9e5"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="#64736f">${v}</text>`});
  g+=`<line x1="${X(qd.skip_ref)}" x2="${X(qd.skip_ref)}" y1="${T}" y2="${T+ph}" stroke="#9aa39d" stroke-dasharray="6 5"/><line x1="${L}" x2="${L+pw}" y1="${Y(qd.play_ref)}" y2="${Y(qd.play_ref)}" stroke="#9aa39d" stroke-dasharray="6 5"/>`;
  g+=`<text x="${X(qd.skip_ref)+5}" y="${T+ph-6}" font-size="11" fill="#7c867f">快滑均值 ${f(qd.skip_ref,1)}%</text><text x="${L+pw-6}" y="${Y(qd.play_ref)-5}" text-anchor="end" font-size="11" fill="#7c867f">均播均值 ${f(qd.play_ref,1)}s</text>`;
  g+=`<text x="${L+pw/2}" y="${H-14}" text-anchor="middle" font-size="14" font-weight="700" fill="#142b2b">3s 快滑率（%）　← 越低越好</text><text transform="translate(18 ${T+ph/2}) rotate(-90)" text-anchor="middle" font-size="14" font-weight="700" fill="#142b2b">平均播放时长（秒）　→ 越长越好</text>`;
  g+=`<g><rect x="${obs[0].x}" y="${obs[0].y}" width="${obs[0].w}" height="${obs[0].h}" rx="8" fill="#d4f7e6" stroke="#0f9d6b" stroke-width="2"/><text x="${obs[0].x+14}" y="${obs[0].y+24}" font-size="15" font-weight="700" fill="#0f9d6b">← 高 eco 象限</text><text x="${obs[0].x+28}" y="${obs[0].y+45}" font-size="13" font-weight="700" fill="#0f9d6b">（播放长 + 快滑低）</text></g>`;
  g+=`<g><rect x="${obs[1].x}" y="${obs[1].y}" width="${obs[1].w}" height="${obs[1].h}" rx="8" fill="#fde1e1" stroke="#d9363e" stroke-width="2"/><text x="${obs[1].x+obs[1].w-14}" y="${obs[1].y+24}" text-anchor="end" font-size="15" font-weight="700" fill="#d9363e">低 eco 象限 →</text><text x="${obs[1].x+obs[1].w-14}" y="${obs[1].y+45}" text-anchor="end" font-size="13" font-weight="700" fill="#d9363e">（播放短 + 快滑高）</text></g>`;
  const tiers=['中','低','高'].map(t=>[t,P.filter(p=>p.tier===t)]);
  g+=`<rect x="${obs[2].x}" y="${obs[2].y}" width="${obs[2].w}" height="${obs[2].h}" rx="6" fill="#fff" stroke="#cfd6d0"/>`;
  tiers.forEach(([t,ps],i)=>{const cy=obs[2].y+20+i*26;g+=`<circle cx="${obs[2].x+22}" cy="${cy}" r="${8+i*3}" fill="${TIERC[t]}" opacity=".8"/><text x="${obs[2].x+44}" y="${cy+5}" font-size="13" fill="#142b2b">${t}eco（${ps.length}种 · 消耗${f(ps.reduce((a,p)=>a+p.cost_sum,0)/10000,1)}万）</text>`});
  [...P].sort((a,b)=>b.r-a.r).forEach(p=>{g+=`<circle cx="${p.cx}" cy="${p.cy}" r="${p.r}" fill="${TIERC[p.tier]}" fill-opacity=".72" stroke="#fff" stroke-width="1.5"><title>${esc(p.lab)}｜${p.n} 条｜ECO ${f(p.eco,0)}｜快滑 ${f(p.skip,1)}%｜均播 ${f(p.play,1)}s｜消耗 ¥${f(p.cost_sum,0)}</title></circle>`});
  P.forEach(p=>{const b=p.box,col=FWC[p.framework]||'#7a7a7a',ex=Math.max(b.x,Math.min(p.cx,b.x+b.w)),ey=Math.max(b.y,Math.min(p.cy,b.y+b.h)),d=Math.hypot(ex-p.cx,ey-p.cy);
    if(d>p.r+2){const k=p.r/d;g+=`<line x1="${p.cx+(ex-p.cx)*k}" y1="${p.cy+(ey-p.cy)*k}" x2="${ex}" y2="${ey}" stroke="#7c867f" stroke-width=".8"/>`}
    g+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="4" fill="#fff" fill-opacity=".78" stroke="${col}" stroke-width="1.4"/><text x="${b.x+b.w/2}" y="${b.y+16}" text-anchor="middle" font-size="12" fill="#222">${esc(p.lab)}</text><text x="${b.x+b.w/2}" y="${b.y+31}" text-anchor="middle" font-size="12" fill="#222">eco ${f(p.eco,0)}</text>`});
  return g+'</svg>'}
function quadPanel(cat){return `<div class="panel"><h3>${cat} · 素材类型 × eco 分层 四象限图</h3><p class="small">横轴 3s 快滑率（越低越好）、纵轴平均播放时长（越长越好）；气泡大小 = 该类型消耗合计，颜色 = ECO 三分档（按类型平均 ECO 排名各取 1/3），标签边框颜色 = 创意大类；虚线为${cat}均值。仅含 ≥3 条素材的类型。</p>${quadChart(cat)}${concl('quadrant',cat)}</div>`}
function typesFor(cat){const s=D.stats[cat],avg=s.eco,fwOf=t=>{const c={};D.materials.filter(m=>m.category===cat&&m.type===t&&m.framework).forEach(m=>c[m.framework]=(c[m.framework]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||''};const row=t=>`<tr><td>${esc(fwOf(t.name))}</td><td><b>${esc(t.name)}</b></td><td class="n">${t.n}</td><td class="n">${f(t.cost_sum,0)}</td><td class="n">${f(t.eco,0)}</td><td class="n">${f(t.skip)}%</td><td class="n">${f(t.play)} s</td><td class="n">${f(t.ctr,2)}%</td></tr>`;const H=[['分类'],['素材类型'],['素材数','n'],['消耗(元)','n'],['得分','n'],['3s快滑率','n'],['平均播放时长','n'],['CTR','n']];const hi=s.types.filter(t=>t.eco>=avg).sort((a,b)=>b.eco-a.eco),lo=s.types.filter(t=>t.eco<avg).sort((a,b)=>a.eco-b.eco),sum=a=>a.length?`平均播放 ${f(Math.min(...a.map(t=>t.play)))}–${f(Math.max(...a.map(t=>t.play)))} 秒、3s 快滑 ${f(Math.min(...a.map(t=>t.skip)),0)}–${f(Math.max(...a.map(t=>t.skip)),0)}%`:'';const ii=(D.insights[cat]||{});const tn=s.type_names||{};return quadPanel(cat)+`<div class="panel"><h3>${cat} · 高 ECO：<span class="hi">${esc(ii.hi_types||tn.hi||'')}</span></h3><p class="small">核心特征：${sum(hi)}。品类平均 ECO ${f(avg,0)}。</p>${tbl(H,hi.map(row))}${concl('types_hi',cat)}</div><div class="panel"><h3>${cat} · 低 ECO：<span class="lo">${esc(ii.lo_types||tn.lo||'')}</span></h3><p class="small">核心特征：${sum(lo)}。</p>${tbl(H,lo.map(row))}${concl('types_lo',cat)}</div>`}
function types(){return intro('04 / TYPE TABLE','高 / 低 ECO 素材类型对照','素材类型由逐条画面复核归类，≥3 条才列入；“消耗”为该类型消耗合计（元），“得分”为平均 ECO。')+(scope==='全部'?typesFor('鞋靴')+typesFor('箱包'):typesFor(scope))}
function libRows(){let r=D.materials.filter(inScope).filter(m=>(lib.fw==='全部'||m.framework===lib.fw)&&(lib.q==='全部'||m.quad_cost===lib.q||m.quad_ctr===lib.q)&&(lib.hook==='全部'||m.hook===lib.hook)&&(!lib.kw||[m.key,m.id,m.type,m.story,m.hook_text,(m.ocr||[]).join(' ')].join(' ').toLowerCase().includes(lib.kw.toLowerCase())));const k=lib.sort,dir=k==='skip'?1:-1;return r.sort((a,b)=>((a[k]??(dir>0?1e9:-1e9))-(b[k]??(dir>0?1e9:-1e9)))*dir)}
function card(m){const fr=m.frames||[],img=m.kind==='image';return `<article class="card" id="m-${m.key}"><div class="card-head"><div>${m.framework?`<span class="tag">${esc(m.framework)}</span>`:'<span class="tag g">未复核</span>'}<span class="tag g">${esc(m.category)}</span>${m.quad_cost?`<span class="tag ${m.quad_cost.startsWith('高')?'':'o'}">${esc(m.quad_cost)}</span>`:''}${m.quad_ctr?`<span class="tag b">${esc(m.quad_ctr)}</span>`:''}${img?'<span class="tag g">静态图</span>':''}<h3>${esc(m.type||'—')}</h3><div class="small">原表第 ${m.source_row} 行 · ${esc(m.id)} · 原片 ${m.duration?f(m.duration)+'s':'—'} · 置信度 ${esc(m.confidence||'—')}</div></div><a class="small" href="${esc(m.url)}" target="_blank" rel="noopener">原素材 ↗</a></div><div class="card-body"><div class="preview">${img?`<img src="${esc(fr[0]?.path)}" alt="">`:`<video controls preload="none" playsinline poster="${esc(fr[0]?.path||'')}" src="${esc(m.url)}"></video>`}</div><div><div class="metrics"><div class="metric"><span>ECO</span><b>${f(m.eco,0)}</b></div><div class="metric"><span>3s快滑</span><b>${f(m.skip)}%</b></div><div class="metric"><span>均播</span><b>${f(m.play)}s</b></div><div class="metric"><span>CTR</span><b>${f(m.ctr,2)}%</b></div><div class="metric"><span>消耗</span><b>¥${f(m.cost,0)}</b></div></div><div class="strip">${fr.map(x=>`<button data-frame="${esc(x.path)}" data-cap="${m.key} · ${img?'原图':x.t+'s'}"><img loading="lazy" src="${esc(x.path)}" alt="${x.t}s"><span>${img?'原图':x.t+'s'}</span></button>`).join('')}</div><div class="facts"><div><b>人物</b>${esc(m.person||'—')}</div><div><b>前3秒露脸</b>${m.face3==null?'—':m.face3?'是':'否'}</div><div><b>产品首现</b>${m.product_first==null?(m.reviewed?'30秒内未出现':'—'):m.product_first+'s'}</div><div><b>讲品帧</b>${m.product_frames==null?'—':m.product_frames+'/'+fr.length}</div><div><b>开场钩子</b>${esc(m.hook||'—')}</div><div><b>价格/优惠</b>${m.price==null?'—':m.price?'有':'无'}</div><div><b>30秒切镜</b>${m.cuts30??'—'}</div><div><b>开场字幕</b>${esc(m.hook_text||'—')}</div></div><p style="font-size:13px;margin:10px 0 4px"><b>前 30 秒：</b>${esc(m.story||'—')}</p><details><summary>识别到的字幕（逐帧）</summary><div class="small">${fr.map((x,j)=>m.ocr?.[j]?`<div>${x.t}s：${esc(m.ocr[j])}</div>`:'').join('')||'无可识别文字'}</div></details></div></div></article>`}
function libView(){const rows=libRows(),per=12,pages=Math.max(1,Math.ceil(rows.length/per));lib.page=Math.min(lib.page,pages);const opt=(id,vals,cur)=>`<select id="${id}">${vals.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('')}</select>`;const hooks=['全部',...new Set(D.materials.map(m=>m.hook).filter(Boolean))];return intro('05 / FRAME LIBRARY','逐帧素材库：每条素材前 30 秒','每张卡片 10 帧（0.3–29.5 秒），点击放大；视频直接播放原素材（签名链接可能过期）。')+`<div class="tools"><input id="kw" placeholder="搜索素材类型 / 字幕 / 行号 / 标识" value="${esc(lib.kw)}">${opt('f-fw',['全部',...D.frameworks],lib.fw)}${opt('f-q',['全部','高eco·高消耗','高eco·低消耗','低eco·高消耗','低eco·低消耗','高eco·高CTR','高eco·低CTR','低eco·高CTR','低eco·低CTR'],lib.q)}${opt('f-hook',hooks,lib.hook)}<select id="f-sort">${[['cost','按消耗'],['eco','按 ECO'],['ctr','按 CTR'],['play','按均播'],['skip','按快滑(低→高)']].map(([v,t])=>`<option value="${v}" ${lib.sort===v?'selected':''}>${t}</option>`).join('')}</select></div><p class="small">共 ${rows.length} 条 · 第 ${lib.page}/${pages} 页</p>${rows.slice((lib.page-1)*per,lib.page*per).map(card).join('')||'<div class="status">没有匹配素材</div>'}<div class="pager"><button data-page="${lib.page-1}" ${lib.page<=1?'disabled':''}>上一页</button><span class="small">${lib.page} / ${pages}</span><button data-page="${lib.page+1}" ${lib.page>=pages?'disabled':''}>下一页</button></div>`}
function method(){const a=D.audit,mo=D.materials.filter(m=>m.media_ok).length,rv=D.materials.filter(m=>m.reviewed).length,im=D.materials.filter(m=>m.kind==='image').length;return intro('06 / METHOD','口径与局限','')+`<div class="panel">${tbl([['项目'],['口径']],[['数据','通用分析数据集 - 2026-10-10T114915.478.xlsx / Sheet1；500 条带素材链接（鞋靴 385 / 箱包 115）；第 2 行“整体”作为基准不计入。'],['消耗','“消耗(元)”为统计周期内消耗合计，不是日均；表内无日期列。'],['ECO','“视频号混排eco总分均值(有效曝光口径)”，不是混排分。'],['缺失',`${a.missing_metrics.length} 条缺少 ECO/快滑/均播，不进入指标统计，不补 0。`],['抽帧',`每条视频前 30 秒（不足取全片）0.3/1.5/3/5/8/12/16/20/25/29.5 秒共 10 帧；${mo} 条成功获取，其中 ${im} 条原素材为静态图片。镜头切换按 5 帧/秒的颜色直方图变化自动检测。`],['字幕','macOS Vision 识别关键帧中英文文字；未做语音转写，口播只以画面字幕为准。'],['画面标注',`${rv} 条逐条查看 10 帧 + 字幕后标注：创意大类、素材类型、人物出镜、前3秒露脸、产品首现时间、产品为主体的帧数、开场钩子、价格/优惠、前30秒叙事。离散帧可能漏掉瞬时动作。`],['四象限','各品类内按 ECO、消耗、CTR 中位数切分；“全部”沿用各品类结果。'],['统计','逐素材等权均值，另附消耗加权 ECO；Spearman/Pearson 相关、OLS + 5 折验证。相关不等于因果；素材天数、出价、账户未知。'],['历史','10.08 版（日均消耗口径、两端抽样 66 条）已归档，可从右上角“10.08 旧版”访问。']].map(([x,y])=>`<tr><td style="white-space:nowrap"><b>${x}</b></td><td>${y}</td></tr>`))}</div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('[data-scope]').forEach(b=>b.classList.toggle('active',b.dataset.scope===scope));const s=S();$('#scope-note').textContent=`${scope}：${s.n_rows} 条素材 · ${s.n_valid} 条指标齐全 · ${s.n_reviewed} 条已逐帧复核`;$('#hero-stats').innerHTML=[[s.n_rows,'素材数'],['¥'+f(s.cost_sum/10000,1)+'万','消耗合计'],[f(s.eco,0),`平均 ECO（整体基准 ${f(D.benchmark.eco,0)}）`],[f(s.skip)+'%','平均 3s 快滑率'],[f(s.play)+'s','平均播放时长'],[f(s.ctr,2)+'%','平均 CTR']].map(([a,b])=>`<div class="stat"><strong>${a}</strong><span>${b}</span></div>`).join('');$('#content').innerHTML=({track,driver,quad,types,lib:libView,method})[tab]()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.scope){scope=b.dataset.scope;lib.page=1;render()}else if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.page){lib.page=+b.dataset.page;render();$('.tools').scrollIntoView()}else if(b.dataset.frame){$('#dlg-img').src=b.dataset.frame;$('#dlg-cap').textContent=b.dataset.cap;dlg.showModal()}else if(b.dataset.open){const m=M(b.dataset.open);tab='lib';lib={...lib,fw:'全部',q:'全部',hook:'全部',kw:m.key,page:1};if(scope!=='全部'&&m.category!==scope)scope=m.category;render()}});
document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;if(id==='f-fw')lib.fw=v;else if(id==='f-q')lib.q=v;else if(id==='f-hook')lib.hook=v;else if(id==='f-sort')lib.sort=v;else return;lib.page=1;render()});
let kwTimer;document.addEventListener('input',e=>{if(e.target.id!=='kw')return;clearTimeout(kwTimer);kwTimer=setTimeout(()=>{lib.kw=e.target.value;lib.page=1;render();const k=$('#kw');k.focus();k.setSelectionRange(k.value.length,k.value.length)},300)});
fetch('data/report.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('数据加载失败');return r.json()}).then(d=>{D=d;if(d.insights&&d.insights.title)$('#headline').textContent=d.insights.title;render()}).catch(e=>$('#content').innerHTML=`<div class="status">${esc(e.message)}，请通过本地 HTTP 服务打开。</div>`);
</script>
